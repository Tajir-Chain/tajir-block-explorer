name: Build and Push Docker Image on devnet push 

on:
  push:
    branches:
      - none

permissions:
  contents: write      
  packages: write      
  actions: write

env:
  DOCKER_HUB_REPO: tajirchain/tajir-block-explorer  
  IMAGE_NAME: tajir-block-explorer                  

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract current version from latest tag
        id: get_version
        run: |
          # get the latest tag matching 'tajir-v*', default to tajir-v0.1.0 if none
          LATEST_TAG=$(git tag -l "tajir-v*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            # remove 'tajir-' prefix
            VERSION=${LATEST_TAG#tajir-}
            # increment patch version (x.y.z -> x.y.z+1)
            MAJOR=$(echo $VERSION | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=tajir-$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      # 1) Build + load into the local daemon — do NOT push yet.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_TAG=${{ steps.get_version.outputs.new_tag }}
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ steps.get_version.outputs.new_version }}
            ${{ env.DOCKER_HUB_REPO }}:latest

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.71.0
          wget -qO /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      # 2) GATE — fail the job here (before any push) on HIGH/CRITICAL.
      - name: Trivy scan (blocks the push)
        run: |
          trivy image --severity HIGH,CRITICAL --scanners vuln --exit-code 1 \
            "${{ env.DOCKER_HUB_REPO }}:${{ steps.get_version.outputs.new_version }}"

      # 3) Only reached when the scan passed → push the already-built image
      #    (buildx reuses the layer cache from the build step, so this is fast).
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_TAG=${{ steps.get_version.outputs.new_tag }}
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ steps.get_version.outputs.new_version }}
            ${{ env.DOCKER_HUB_REPO }}:latest

      # 4) Tag the repo ONLY after a clean scan + successful push, so a blocked
      #    build never leaves an orphaned release tag.
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_version.outputs.new_tag }}
          git push origin ${{ steps.get_version.outputs.new_tag }}

      - name: Notify Slack (Success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"🚀 <@U09LHPZ4RGV> *Deployment Successful*\n\n\
            🧾 *Repo:* ${{ github.repository }}\n\
            🏷️ *Git Tag:* ${{ steps.get_version.outputs.new_tag }}\n\
            🐳 *Docker Image:* ${{ env.DOCKER_HUB_REPO }}:${{ steps.get_version.outputs.new_version }}\n\
            🌿 *Branch:* ${{ github.ref_name }}\n\
            👤 *Triggered by:* ${{ github.actor }}\n\
            🔗 *Docker Hub:* https://hub.docker.com/r/${{ env.DOCKER_HUB_REPO }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (Failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"❌ <@U09LHPZ4RGV> *Deployment Failed*\n\n\
            🧾 *Repo:* ${{ github.repository }}\n\
            🌿 *Branch:* ${{ github.ref_name }}\n\
            👤 *Triggered by:* ${{ github.actor }}\n\
            🔗 *Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
