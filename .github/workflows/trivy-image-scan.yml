name: Trivy Scan & Stage (DevNet PR)

# Triggers ONLY on PR events to devnet.
# 'synchronize' and 'reopened' are included so the scan updates if the developer pushes fixes to the PR.
# 'closed' is intentionally omitted to prevent running on merge/close.
on:
  pull_request:
    branches: [devnet]
    types: [opened, synchronize, reopened]

env:
  FAIL_ON_VULNERABILITIES: true
  DOCKERHUB_IMAGE: tajirchain/tajir-block-explorer
  # Use the PR head SHA to ensure the staged image matches the exact code being reviewed
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  TRIVY_VERSION: "0.71.0"

permissions:
  contents: read
  pull-requests: write   # Needed to comment the staged image tag on the PR

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve image tag
        id: meta
        run: |
          echo "tag=${DOCKERHUB_IMAGE}:scan-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Staging image as: ${DOCKERHUB_IMAGE}:scan-${SOURCE_SHA}"

      # ── SCAN LIST ───────────────────────────────────────────────────────────
      # The scan step iterates over scan-images.txt, so it must exist.
      # The PR's built image is always scanned; optionally append extra images
      # (one per line) by committing a scan-images.extra.txt at the repo root.
      - name: Prepare image scan list
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.meta.outputs.tag }}" > "$GITHUB_WORKSPACE/scan-images.txt"
          if [ -f "$GITHUB_WORKSPACE/scan-images.extra.txt" ]; then
            cat "$GITHUB_WORKSPACE/scan-images.extra.txt" >> "$GITHUB_WORKSPACE/scan-images.txt"
          fi
          sort -u "$GITHUB_WORKSPACE/scan-images.txt" -o "$GITHUB_WORKSPACE/scan-images.txt"
          echo "Images to scan:"
          cat "$GITHUB_WORKSPACE/scan-images.txt"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true

      - name: Build image
        # --no-cache ensures prior vulnerable node_modules layers cannot survive
        run: docker build --no-cache -t "${{ steps.meta.outputs.tag }}" .

      # ── TRIVY INSTALLATION (pinned, checksum-verified) ──────────────────────
      - name: Install Trivy
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"

          VERSION="${TRIVY_VERSION}"
          echo "Installing Trivy v${VERSION}..."

          # Reinstall if missing OR if a different version is already cached
          NEEDS_INSTALL=0
          if [ ! -x "$BIN_DIR/trivy" ]; then
            NEEDS_INSTALL=1
          elif ! "$BIN_DIR/trivy" --version 2>/dev/null | grep -q "Version: ${VERSION}"; then
            NEEDS_INSTALL=1
          fi

          if [ "$NEEDS_INSTALL" = "1" ]; then
            rm -f "$BIN_DIR/trivy"
            # Official Trivy installer — picks correct asset for the platform,
            # verifies the SHA256 checksum, and installs to -b <dir>.
            curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh" \
              | sh -s -- -b "$BIN_DIR" "v${VERSION}"
          fi

          "$BIN_DIR/trivy" --version
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      # ── TRIVY SCANNING (CLI, multi-image) ───────────────────────────────────
      - name: Run Trivy vulnerability scanner
        id: trivy
        run: |
          set -euo pipefail
          rm -f trivy-results.json trivy-report.txt trivy-json-parts.txt trivy-table-parts.txt
          touch trivy-json-parts.txt trivy-table-parts.txt

          while IFS= read -r IMG; do
            [ -z "$IMG" ] && continue
            SAFE=$(printf '%s' "$IMG" | tr '/:' '__')

            echo "::group::Scanning ${IMG}"
            trivy image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              --timeout 20m \
              --format json \
              --output "trivy-${SAFE}.json" \
              "$IMG"

            # Convert JSON → human-readable table. Fallback to raw JSON if
            # `trivy convert` is unavailable or chokes on a malformed result.
            trivy convert --format table --output "trivy-${SAFE}.txt" "trivy-${SAFE}.json" 2>/dev/null \
              || cp "trivy-${SAFE}.json" "trivy-${SAFE}.txt"
            echo "::endgroup::"

            echo "trivy-${SAFE}.json" >> trivy-json-parts.txt
            echo "trivy-${SAFE}.txt"  >> trivy-table-parts.txt
          done < "$GITHUB_WORKSPACE/scan-images.txt"

          # Guard against empty file lists: `jq -s '...' $(cat file)` and
          # `cat $(cat file)` both hang/fail when the parts file is empty.
          # Use mapfile + array expansion instead.
          if [ -s trivy-json-parts.txt ]; then
            mapfile -t JSON_FILES < trivy-json-parts.txt
            jq -s '{Results: [ .[] | (.Results // [])[] ]}' "${JSON_FILES[@]}" > trivy-results.json
          else
            echo '{"Results":[]}' > trivy-results.json
          fi

          if [ -s trivy-table-parts.txt ]; then
            mapfile -t TABLE_FILES < trivy-table-parts.txt
            cat "${TABLE_FILES[@]}" > trivy-report.txt
          else
            : > trivy-report.txt
          fi

      # ── SUMMARY GENERATION ──────────────────────────────────────────────────
      - name: Generate Trivy Summary
        id: summary
        run: |
          set -euo pipefail
          echo "## Trivy HIGH/CRITICAL — ${{ github.repository }} @ \`${SOURCE_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f trivy-results.json ]; then
            echo "**No scan results available — failing CLOSED.**" >> $GITHUB_STEP_SUMMARY
            echo "total=-1" >> $GITHUB_OUTPUT   # sentinel: "-1" != "0" → gate fails below
            exit 0
          fi

          TOTAL=$(jq '[.Results[]? | (.Vulnerabilities // []) | length] | add // 0' trivy-results.json)

          echo "### Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Type | Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|-----------------|" >> $GITHUB_STEP_SUMMARY

          jq -r '.Results[]? | [.Target, .Type, ((.Vulnerabilities // []) | length)] | @tsv' trivy-results.json | \
          while IFS=$'\t' read -r target type vuln_count; do
            echo "| ${target} | ${type} | ${vuln_count} |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Vulnerabilities Found: ${TOTAL}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 0 ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Detailed Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| CVE ID | Severity | Package | Installed | Fixed In | Title |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|---------|-----------|----------|-------|" >> $GITHUB_STEP_SUMMARY

            jq -r '
              .Results[]? |
              (.Vulnerabilities // [])[] |
              [
                .VulnerabilityID,
                .Severity,
                .PkgName,
                .InstalledVersion,
                (.FixedVersion // "N/A"),
                (.Title // .Description // "No title")
              ] |
              @tsv
            ' trivy-results.json | \
            while IFS=$'\t' read -r cve severity pkg installed fixed title; do
              title_short="${title:0:80}"
              [ "${#title}" -gt 80 ] && title_short="${title_short}..."
              echo "| ${cve} | **${severity}** | ${pkg} | ${installed} | ${fixed} | ${title_short} |" >> $GITHUB_STEP_SUMMARY
            done

            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "> **Tip:** Download the full `trivy-report.txt` artifact for complete details." >> $GITHUB_STEP_SUMMARY
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Vulnerability Gate
        id: gate
        if: steps.summary.outcome == 'success'
        run: |
          TOTAL="${{ steps.summary.outputs.total }}"
          if [ "${FAIL_ON_VULNERABILITIES}" = "true" ] && [ "${TOTAL}" != "0" ]; then
            echo "FAIL_ON_VULNERABILITIES is enabled."
            echo "  Found ${TOTAL} HIGH/CRITICAL vulnerability(s)."
            echo "  Pipeline is BLOCKED. Fix vulnerabilities before proceeding."
            exit 1
          fi
          echo "No HIGH/CRITICAL vulnerabilities found. Gate passed."

      # ── NOTIFICATION & FAILURE HANDLING ─────────────────────────────────────
      - name: Notify Slack on failure
        if: failure()   # fires on gate failure AND build/scan infra failures
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build the payload with jq so quotes/backticks/newlines are escaped correctly
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg sha "${SOURCE_SHA::7}" \
            --arg url "$RUN_URL" \
            '{text: "🛡️ *Trivy scan failed in \($repo)* (PR `\($ref)`, sha `\($sha)`)\n🔗 \($url)"}')
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "${SLACK_WEBHOOK_URL}" || true

      - name: Fail if findings
        if: steps.gate.outcome == 'failure'
        run: |
          echo "HIGH/CRITICAL vulnerabilities present — see Job Summary." >&2
          exit 1

      # ── STAGE THE SCANNED IMAGE FOR REUSE (Only if Gate Passes) ─────────────
      - name: Login to DockerHub
        if: steps.gate.outcome == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push staged image
        if: steps.gate.outcome == 'success'
        run: |
          docker push "${{ steps.meta.outputs.tag }}"
          echo "Staged image: ${{ steps.meta.outputs.tag }}"

      - name: Comment staged image on PR
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="HIGH/CRITICAL clean"
          [ "${FAIL_ON_VULNERABILITIES}" != "true" ] && MODE="scan complete (advisory — findings not blocking)"
          BODY="🐳 Image built & scanned (${MODE}) and staged as \`${{ steps.meta.outputs.tag }}\`. It will be promoted as-is on merge — no rebuild."
          ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("🐳 Image built")) | .id' | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi

      - name: Upload Trivy reports to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports
          path: |
            trivy-results.json
            trivy-report.txt
            trivy-*.json
            trivy-*.txt
          retention-days: 30
          if-no-files-found: warn